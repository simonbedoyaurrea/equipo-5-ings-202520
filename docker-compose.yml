# docker-compose.yml

services:
  db:
    image: postgres:16
    container_name: cultivapp-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cultivapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server/src/cultivapp/cultivapp 
      dockerfile: Dockerfile
    container_name: cultivapp-backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cultivapp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    restart: always

  frontend:
    build:
      context: ./client/src/
      dockerfile: Dockerfile
    container_name: cultivapp-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: always

volumes:
  postgres_data:
